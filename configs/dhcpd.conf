# /etc/dhcp/dhcpd.conf
# ISC DHCP Server — Blue Team Lab
# Interface: ens19 (192.168.100.1/24, internal lab network)
# Configured via: /etc/default/isc-dhcp-server → INTERFACESv4="ens19"

# This server is the authoritative DHCP server for the 192.168.100.0/24 subnet.
authoritative;

# Global defaults (overridden per-subnet where needed)
default-lease-time 602;
max-lease-time 7200;

# Internal lab subnet
subnet 192.168.100.0 netmask 255.255.255.0 {

    # Address pool — reserved IPs below .10 for static assignments:
    #   .1   ubuntu-server (DHCP/DNS)
    #   .2   pfSense WAN
    #   .3   win-server (Active Directory DC)
    #   .113 wazuh (SIEM)
    range 192.168.100.10 192.168.100.50;

    option subnet-mask          255.255.255.0;
    option routers              192.168.100.1;
    option domain-name-servers  8.8.8.8, 8.8.4.4;
    option domain-name          "red.local";
}
