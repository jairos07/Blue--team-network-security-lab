# Wazuh SIEM — Docker Compose deployment
#
# Prerequisites:
#   1. Copy .env.example to .env and fill in your credentials:
#        cp .env.example .env
#   2. Edit .env and set INDEXER_USERNAME and INDEXER_PASSWORD
#   3. Run: docker-compose up -d
#
# The .env file is excluded from version control (.gitignore).
# Never commit real credentials to the repository.

version: "3.8"

services:
  wazuh:
    image: ghcr.io/wazuh/wazuh:latest
    container_name: wazuh
    restart: always
    ports:
      - "443:443"       # Wazuh WebGUI (HTTPS)
      - "1514:1514/udp" # Agent event forwarding
      - "1515:1515"     # Agent registration
      - "55000:55000"   # Wazuh REST API
    environment:
      - INDEXER_USERNAME=${INDEXER_USERNAME}
      - INDEXER_PASSWORD=${INDEXER_PASSWORD}
    volumes:
      - wazuh_data:/var/ossec/data
      - wazuh_logs:/var/ossec/logs

volumes:
  wazuh_data:
  wazuh_logs:
